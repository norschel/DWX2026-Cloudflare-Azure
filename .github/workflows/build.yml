name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EdgeBeforeAzure.slnx

      - name: Build
        run: dotnet build EdgeBeforeAzure.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test EdgeBeforeAzure.slnx --configuration Release --no-build

      - name: Publish API
        run: dotnet publish src/EdgeBeforeAzure.Api/EdgeBeforeAzure.Api.csproj --configuration Release --output out/api --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-before-azure-api
          path: out/api

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: edge-before-azure-demo-app
          package: out/api





