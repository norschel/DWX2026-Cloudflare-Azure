name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EdgeBeforeAzure.slnx

      - name: Build
        run: dotnet build EdgeBeforeAzure.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test EdgeBeforeAzure.slnx --configuration Release --no-build

      - name: Publish API
        run: dotnet publish src/EdgeBeforeAzure.Api/EdgeBeforeAzure.Api.csproj --configuration Release --output out/api --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-before-azure-api
          path: out/api
